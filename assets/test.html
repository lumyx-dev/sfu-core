<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <title>Lumyx</title>
  <style>
/* ===== LUMYX DESIGN TOKENS — copied verbatim from the handoff. Do not hand-edit. ===== */
/* One family, no monospace. Geist is what the repo's dashboard already declares via next/font,
   and its tabular figures are good enough to carry every number in the product. */
@import url("https://fonts.googleapis.com/css2?family=Geist:wght@300..800&display=swap");

:root{
  /* ── Neutrals: near-neutral with a faint cool cast. The system is 90% these. ── */
  --n-0:#ffffff;
  --n-25:#fbfbfc;
  --n-50:#f5f6f8;
  --n-100:#ebedf1;
  --n-150:#e4e7ec;
  --n-200:#dee1e7;
  --n-300:#c6cad4;
  --n-400:#9298a6;
  --n-500:#6b7180;
  --n-600:#4d5361;
  --n-700:#383d49;
  --n-800:#23262e;
  --n-900:#15171c;
  --n-950:#0b0c10;

  /* ── Accent: indigo. Saturated and confident — the primary action, the selected row,
        focus rings, and the primary data series. ── */
  --indigo-50:#eeecfe;
  --indigo-100:#ded8fd;
  --indigo-400:#7c68f8;
  --indigo-500:#4f39f6;
  --indigo-600:#3d24d9;
  --indigo-700:#2f1aa8;
  --indigo-900:#1e1170;

  /* ── Secondary: coral. The room / session axis, against indigo's peer axis. ── */
  --coral-50:#fff0ea;
  --coral-400:#ff8a5c;
  --coral-500:#f0521f;
  --coral-600:#c93c0f;

  /* ── Semantics. The 500s are fills, dots, chart strokes and dark-mode ink; the 600s are the
        light-theme ink steps (they clear 4.5:1 on both white and their own tint). ── */
  --green-50:#e6f9ef;
  --green-400:#34c77b;
  --green-500:#0fa15c;
  --green-600:#0a7a45;
  --amber-50:#fff4de;
  --amber-400:#f9b23c;
  --amber-500:#dd8a00;
  --amber-600:#9a5f00;
  --red-50:#ffecea;
  --red-400:#ff6b5a;
  --red-500:#e5342a;
  --red-600:#b8201c;
  --blue-50:#e9f1ff;
  --blue-400:#5b9bff;
  --blue-500:#2f6df0;
  --blue-600:#1f4fc0;

  /* ── Chart series: five values that stay legible next to each other. ── */
  --series-1:#4f39f6;
  --series-2:#f0521f;
  --series-3:#0fa15c;
  --series-4:#dd8a00;
  --series-5:#6b7180;
}

/* Light is the default. `.theme-dark` re-points the same aliases — every component reads only
   from this file, so nothing needs a dark-mode branch in JS. */
:root{
  --surface-page:var(--n-50);
  --surface-card:var(--n-0);
  --surface-sunken:var(--n-25);
  --surface-inset:var(--n-50);
  --surface-hover:var(--n-50);
  --surface-active:var(--n-100);
  --surface-overlay:rgba(11,12,16,.55);

  /* Hairlines, deliberately quiet: shadow and surface carry the separation, not the stroke. */
  --border:var(--n-100);
  --border-strong:var(--n-150);
  --border-subtle:#f1f2f6;

  --text-strong:var(--n-900);
  --text-body:var(--n-700);
  --text-muted:var(--n-500);
  --text-faint:var(--n-400);
  --text-on-accent:var(--n-0);
  --text-on-overlay:var(--n-0);

  --accent:var(--indigo-500);
  --accent-hover:var(--indigo-600);
  --accent-tint:var(--indigo-50);
  --accent-border:var(--indigo-100);
  --accent-text:var(--indigo-600);

  --accent-2:var(--coral-500);
  --accent-2-tint:var(--coral-50);

  /* Ink steps: these carry 11–13px text, so they are the 600s, not the bright fills. */
  --ok:var(--green-600);
  --ok-tint:var(--green-50);
  --ok-solid:var(--green-500);
  --warn:var(--amber-600);
  --warn-tint:var(--amber-50);
  --warn-solid:var(--amber-500);
  --danger:var(--red-600);
  --danger-tint:var(--red-50);
  --danger-solid:var(--red-500);
  --info:var(--blue-600);
  --info-tint:var(--blue-50);
  --info-solid:var(--blue-500);
  --idle:var(--n-400);
  --idle-tint:var(--n-100);
}

.theme-dark{
  --surface-page:var(--n-950);
  --surface-card:var(--n-900);
  --surface-sunken:#101216;
  --surface-inset:#101216;
  --surface-hover:var(--n-800);
  --surface-active:var(--n-700);
  --surface-overlay:rgba(6,7,10,.66);

  --border:#22262e;
  --border-strong:#2f343d;
  --border-subtle:#191c22;

  --text-strong:var(--n-50);
  --text-body:var(--n-200);
  --text-muted:var(--n-400);
  --text-faint:var(--n-500);
  --text-on-accent:var(--n-0);

  --accent:var(--indigo-400);
  --accent-hover:#9484fa;
  --accent-tint:rgba(124,104,248,.16);
  --accent-border:rgba(124,104,248,.34);
  --accent-text:#a596fb;

  --accent-2:var(--coral-400);
  --accent-2-tint:rgba(255,138,92,.16);

  --ok:var(--green-400);
  --ok-tint:rgba(52,199,123,.16);
  --ok-solid:var(--green-400);
  --warn:var(--amber-400);
  --warn-tint:rgba(249,178,60,.16);
  --warn-solid:var(--amber-400);
  --danger:var(--red-400);
  --danger-tint:rgba(255,107,90,.16);
  --danger-solid:var(--red-400);
  --info:var(--blue-400);
  --info-tint:rgba(91,155,255,.16);
  --info-solid:var(--blue-400);
  --idle:var(--n-500);
  --idle-tint:var(--n-800);
}

:root{
  --font-sans:'Geist','Geist Fallback',system-ui,-apple-system,'Segoe UI',sans-serif;

  /* One scale, no monospace tier. Data and prose share it. */
  --fs-11:11px; /* @kind font */
  --fs-12:12px; /* @kind font */
  --fs-13:13px; /* @kind font */
  --fs-14:14px; /* @kind font */
  --fs-16:16px; /* @kind font */
  --fs-20:20px; /* @kind font */
  --fs-26:26px; /* @kind font */
  --fs-34:34px; /* @kind font */
  --fs-44:44px; /* @kind font */

  --lh-flat:1; /* @kind font */
  --lh-tight:1.2; /* @kind font */
  --lh-snug:1.4; /* @kind font */
  --lh-body:1.6; /* @kind font */

  --fw-light:300; /* @kind font */
  --fw-regular:400; /* @kind font */
  --fw-medium:500; /* @kind font */
  --fw-semibold:600; /* @kind font */
  --fw-bold:700; /* @kind font */

  --ls-display:-0.02em; /* @kind font */
  --ls-tight:-0.01em; /* @kind font */
  --ls-normal:0; /* @kind font */
  --ls-label:0.06em; /* @kind font */
}

:root{
  --space-0:0;
  --space-1:2px;
  --space-2:4px;
  --space-3:6px;
  --space-4:8px;
  --space-5:12px;
  --space-6:16px;
  --space-7:20px;
  --space-8:24px;
  --space-9:32px;
  --space-10:40px;
  --space-11:48px;
  --space-12:64px;

  --pad-card:var(--space-7);
  --pad-card-tight:var(--space-6);
  --pad-cell:var(--space-5) var(--space-6);
  --gap-grid:var(--space-6);
  --gap-section:var(--space-8);

  --content-max:1360px;
  --sidebar-w:248px;
  --rail-w:340px;
  --grid-size:8px; /* @kind spacing */
}

:root{
  /* Soft. Nothing in the product has a hard corner except the page itself. */
  --radius-xs:8px;
  --radius-sm:12px;
  --radius-md:14px;
  --radius-lg:18px;
  --radius-xl:24px;
  --radius-pill:999px;
  --border-width:1px; /* @kind other */
}

:root{
  /* Real, soft, neutral shadows — cast from a single high light source. No coloured glow. */
  --shadow-xs:0 1px 2px rgba(21,23,28,.05);
  --shadow-sm:0 1px 3px rgba(21,23,28,.07), 0 1px 2px rgba(21,23,28,.04);
  --shadow-md:0 6px 16px -4px rgba(21,23,28,.11), 0 2px 6px -2px rgba(21,23,28,.06);
  --shadow-lg:0 16px 40px -12px rgba(21,23,28,.17), 0 4px 12px -6px rgba(21,23,28,.09);
  --shadow-none:none; /* @kind shadow */

  --ring-accent:0 0 0 3px rgba(79,57,246,.20); /* @kind shadow */
  --ring-danger:0 0 0 3px rgba(184,32,28,.20); /* @kind shadow */

  --blur-overlay:blur(6px); /* @kind other */
}

.theme-dark{
  --shadow-xs:0 1px 2px rgba(0,0,0,.4);
  --shadow-sm:0 1px 3px rgba(0,0,0,.45);
  --shadow-md:0 8px 20px -6px rgba(0,0,0,.55);
  --shadow-lg:0 20px 48px -16px rgba(0,0,0,.65);
  --ring-accent:0 0 0 3px rgba(124,104,248,.28); /* @kind shadow */
  --ring-danger:0 0 0 3px rgba(255,107,90,.24); /* @kind shadow */
}

:root{
  --dur-1:120ms; /* @kind other */ /* hover, tint changes */
  --dur-2:180ms; /* @kind other */ /* the default */
  --dur-3:260ms; /* @kind other */ /* size / position */
  --ease-out:cubic-bezier(.2,.6,.2,1); /* @kind other */
  --ease-in-out:cubic-bezier(.4,0,.2,1); /* @kind other */
}

/* The only looping animation in the system: a slow, low-contrast breath on a live indicator.
   Nothing blinks, nothing pulses hard, nothing shimmers in a colour. */
@keyframes sl-breathe{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes sl-shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

*{box-sizing:border-box}
body{margin:0;font-family:var(--font-sans);font-size:var(--fs-13);line-height:var(--lh-snug);background:var(--surface-page);color:var(--text-body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,h4{margin:0;color:var(--text-strong);font-weight:var(--fw-semibold);letter-spacing:var(--ls-tight)}
a{color:var(--accent-text);text-decoration:none}
a:hover{color:var(--accent-hover);text-decoration:underline;text-underline-offset:2px}
::selection{background:var(--accent-tint);color:var(--text-strong)}

/* Every number in the product is tabular. */
.sl-num{font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1}

/* 11px uppercase micro-label — the one typographic mannerism the system allows. */
.sl-label{font-size:var(--fs-11);font-weight:var(--fw-medium);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-muted)}

.sl-scroll{scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent}
.sl-scroll::-webkit-scrollbar{width:10px;height:10px}
.sl-scroll::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:var(--radius-pill);border:3px solid transparent;background-clip:content-box}
.sl-scroll::-webkit-scrollbar-track{background:transparent}
/* ===== END LUMYX DESIGN TOKENS ===== */

    /* ── App shell ────────────────────────────────────────────────── */
    .app {
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 100vh;
      max-width: var(--content-max);
      margin: 0 auto;
      padding: 0 var(--space-8);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-6) 0;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: var(--space-5);
    }

    .brand-name {
      font-size: var(--fs-16);
      font-weight: var(--fw-semibold);
      letter-spacing: var(--ls-display);
      color: var(--text-strong);
    }

    .brand-sub {
      font-size: var(--fs-12);
      color: var(--text-muted);
    }

    /* ── Pill (core/Pill) ─────────────────────────────────────────── */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: var(--space-4);
      padding: 5px 12px;
      border-radius: var(--radius-pill);
      background: var(--surface-card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-xs);
      font-size: var(--fs-12);
      color: var(--text-body);
      white-space: nowrap;
    }

    /* ── StatusDot (core/StatusDot) — script sets className = 'status-dot ' + phase ── */
    .status-dot {
      display: inline-block;
      flex: 0 0 auto;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--idle);
      --dot-color: var(--idle);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--dot-color) 16%, transparent);
      transition: background var(--dur-2) var(--ease-out);
    }

    .status-dot.connected {
      background: var(--ok);
      --dot-color: var(--ok);
    }

    .status-dot.connecting {
      background: var(--warn);
      --dot-color: var(--warn);
      animation: sl-breathe 2.6s var(--ease-in-out) infinite;
    }

    .status-dot.disconnected {
      background: var(--danger);
      --dot-color: var(--danger);
    }

    /* ── main layout ──────────────────────────────────────────────── */
    .main {
      display: grid;
      grid-template-columns: 1fr var(--rail-w);
      gap: var(--gap-grid);
      padding: var(--space-8) 0;
      min-height: 0;
    }

    .video-section {
      display: flex;
      flex-direction: column;
      gap: var(--space-6);
      min-width: 0;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: var(--space-6);
      min-width: 0;
    }

    /* ── Card (core/Card) ─────────────────────────────────────────── */
    .card {
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-5);
      padding: 14px var(--space-7);
      flex: 0 0 auto;
    }

    .card-title-group {
      display: inline-flex;
      align-items: baseline;
      gap: var(--space-4);
      min-width: 0;
    }

    .card-title {
      font-size: var(--fs-14);
      font-weight: var(--fw-semibold);
      color: var(--text-strong);
    }

    .card-meta {
      font-size: var(--fs-12);
      color: var(--text-muted);
    }

    .card-body {
      flex: 1;
      min-height: 0;
    }

    .card-body-padded {
      padding: 0 var(--space-7) var(--space-7);
    }

    /* ── Button (core/Button) ─────────────────────────────────────── */
    .controls {
      display: flex;
      gap: var(--space-4);
      flex-wrap: wrap;
    }

    .btn {
      font-family: var(--font-sans);
      font-weight: var(--fw-medium);
      letter-spacing: var(--ls-normal);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      cursor: pointer;
      outline: none;
      transition:
        background var(--dur-1) var(--ease-out),
        border-color var(--dur-1) var(--ease-out),
        box-shadow var(--dur-1) var(--ease-out);
      font-size: var(--fs-13);
      padding: 9px 16px;
      border-radius: var(--radius-sm);
      gap: var(--space-4);
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: .45;
    }

    .btn:focus-visible {
      box-shadow: var(--ring-accent);
    }

    .btn-primary {
      background: var(--accent);
      border: 1px solid var(--accent);
      color: var(--text-on-accent);
      box-shadow: var(--shadow-xs);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .btn-secondary {
      background: var(--surface-card);
      border: 1px solid var(--border);
      color: var(--text-strong);
      box-shadow: var(--shadow-xs);
    }

    .btn-secondary:hover:not(:disabled) {
      background: var(--surface-hover);
      border-color: var(--border-strong);
    }

    .btn-danger {
      background: var(--surface-card);
      border: 1px solid var(--border);
      color: var(--danger);
      box-shadow: var(--shadow-xs);
    }

    .btn-danger:hover:not(:disabled) {
      background: var(--danger-tint);
      border-color: var(--danger);
    }

    .btn-danger:focus-visible {
      box-shadow: var(--ring-danger);
    }

    /* ── VideoTile (webrtc/VideoTile) ─────────────────────────────── */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: var(--gap-grid);
    }

    .video-card {
      position: relative;
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--surface-inset);
      box-shadow: var(--shadow-xs);
      min-width: 0;
      aspect-ratio: 16/10;
    }

    .video-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* .label is set directly by the script for the remote card */
    .video-card .label {
      position: absolute;
      bottom: var(--space-5);
      left: var(--space-5);
      right: var(--space-5);
      display: inline-flex;
      align-items: center;
      gap: var(--space-4);
      min-width: 0;
      background: var(--surface-overlay);
      color: var(--text-on-overlay);
      backdrop-filter: var(--blur-overlay);
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      font-size: var(--fs-12);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      width: max-content;
    }

    /* .indicator / .indicator.live are set directly by the script */
    .video-card .indicator {
      position: absolute;
      top: var(--space-5);
      right: var(--space-5);
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--danger);
      --dot-color: var(--danger);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--dot-color) 16%, transparent);
    }

    .video-card .indicator.live {
      background: var(--ok);
      --dot-color: var(--ok);
      animation: sl-breathe 2.6s var(--ease-in-out) infinite;
    }

    .video-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-4);
      color: var(--text-faint);
      font-size: var(--fs-12);
    }

    /* ── MetricGrid / MetricCard (data/MetricGrid, data/MetricCard) ─ */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1px;
      background: var(--border-subtle);
    }

    .metric {
      padding: var(--space-6) var(--space-7);
      background: var(--surface-card);
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
      min-width: 0;
    }

    .metric-value {
      display: flex;
      align-items: baseline;
      gap: 3px;
      font-size: var(--fs-34);
      font-weight: var(--fw-medium);
      letter-spacing: var(--ls-display);
      line-height: var(--lh-flat);
      color: var(--text-strong);
    }

    .metric-unit {
      font-size: var(--fs-14);
      font-weight: var(--fw-regular);
      color: var(--text-muted);
    }

    /* ── EventList (data/EventList) — script builds .log-entry / .log-time /
       .log-msg directly, with type in {send,info,event,error} ─────── */
    .log-container {
      height: 260px;
      overflow-y: auto;
    }

    .log-entry {
      display: grid;
      grid-template-columns: 58px 1fr;
      gap: var(--space-5);
      align-items: baseline;
      padding: 10px var(--space-7);
      font-size: var(--fs-12);
    }

    .log-entry:not(:first-child) {
      border-top: 1px solid var(--border-subtle);
    }

    .log-time {
      color: var(--text-faint);
      font-variant-numeric: tabular-nums;
      font-feature-settings: 'tnum' 1;
    }

    .log-msg {
      word-break: break-word;
    }

    .log-msg.info {
      color: var(--text-body);
    }

    .log-msg.event {
      color: var(--ok);
    }

    .log-msg.send {
      color: var(--warn);
    }

    .log-msg.error {
      color: var(--danger);
    }

    /* ── StatusStrip (layout/StatusStrip) ─────────────────────────── */
    .statusstrip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-6);
      padding: var(--space-5) 0;
      border-top: 1px solid var(--border);
      font-size: var(--fs-12);
      color: var(--text-muted);
    }

    .statusstrip-items {
      display: flex;
      gap: var(--space-7);
      flex: 0 0 auto;
    }

    .statusstrip-item {
      display: inline-flex;
      gap: var(--space-3);
    }

    .statusstrip-value {
      color: var(--text-strong);
    }
  </style>
</head>

<body>
  <div class="app">

    <header class="header">
      <div class="brand">
        <span class="brand-name">Lumyx</span>
        <span class="brand-sub">Session console</span>
      </div>
      <span class="pill">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">disconnected</span>
      </span>
    </header>

    <main class="main">
      <div class="video-section">

        <section class="card">
          <header class="card-header">
            <span class="card-title-group">
              <h3 class="card-title">Session</h3>
            </span>
          </header>
          <div class="card-body card-body-padded">
            <div class="controls">
              <button class="btn btn-primary" id="btnConnect">Connect</button>
              <button class="btn btn-secondary" id="btnCamera" disabled>Enable camera</button>
              <button class="btn btn-secondary" id="btnCall" disabled>Call SFU</button>
              <button class="btn btn-secondary" id="btnJoin" disabled>Join room</button>
              <button class="btn btn-danger" id="btnDisconnect" disabled>Disconnect</button>
            </div>
          </div>
        </section>

        <div class="video-grid" id="videoGrid">
          <div class="video-card" id="localCard">
            <video id="localVideo" autoplay muted playsinline></video>
            <div class="label">local</div>
            <div class="indicator" id="localIndicator"></div>
            <div class="video-placeholder" id="localPlaceholder">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path
                  d="M15 10l4.553-2.069A1 1 0 0121 8.82v6.361a1 1 0 01-1.447.894L15 14M3 8a2 2 0 012-2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z" />
              </svg>
              Camera off
            </div>
          </div>
        </div>
      </div>

      <div class="sidebar">
        <div class="card">
          <div class="card-header">
            <span class="card-title-group">
              <h3 class="card-title">Metrics</h3>
              <span class="card-meta">1s poll</span>
            </span>
          </div>
          <div class="card-body">
            <div class="metrics-grid">
              <div class="metric">
                <span class="sl-label">Rooms</span>
                <span class="sl-num metric-value" id="metricRooms">0</span>
              </div>
              <div class="metric">
                <span class="sl-label">Peers</span>
                <span class="sl-num metric-value" id="metricPeers">0</span>
              </div>
              <div class="metric">
                <span class="sl-label">RTP packets</span>
                <span class="sl-num metric-value" id="metricPackets">0</span>
              </div>
              <div class="metric">
                <span class="sl-label">Forwarded</span>
                <span class="sl-num metric-value" id="metricBytes">0<span class="metric-unit">MB</span></span>
              </div>
            </div>
          </div>
        </div>

        <div class="card" style="flex:1">
          <div class="card-header">
            <span class="card-title-group">
              <h3 class="card-title">Events</h3>
            </span>
            <span class="card-meta sl-num" id="logCount">0</span>
          </div>
          <div class="card-body">
            <div class="log-container sl-scroll" id="log"></div>
          </div>
        </div>
      </div>
    </main>

    <footer class="statusstrip">
      <span class="statusstrip-left">peer_id: <span class="sl-num statusstrip-value" id="footerPeerId">—</span></span>
      <span class="statusstrip-items">
        <span class="statusstrip-item">
          <span class="sl-label">Room</span>
          <span class="sl-num statusstrip-value" id="footerRoom">—</span>
        </span>
      </span>
    </footer>

  </div>

  <script>
    const WS_URL = `wss://${window.location.host}/ws`;
    const ROOM_ID = "test-room";

    let ws, pc, localStream, peerId;
    let logCount = 0;

    // ── Metrics polling ──────────────────────────────────
    setInterval(async () => {
      try {
        const r = await fetch('/metrics');
        const data = await r.json();
        document.getElementById('metricRooms').textContent = data.rooms ?? 0;
        document.getElementById('metricPeers').textContent = data.peers ?? 0;
        document.getElementById('metricPackets').textContent =
          (data.metrics?.rtp_packets_forwarded ?? 0).toLocaleString();
        document.getElementById('metricBytes').textContent =
          ((data.metrics?.bytes_forwarded ?? 0) / 1_000_000).toFixed(1);
      } catch { }
    }, 1000);

    // ── Log ──────────────────────────────────────────────
    const log = (msg, type = "info") => {
      const el = document.getElementById("log");
      const entry = document.createElement("div");
      entry.className = "log-entry";
      const now = new Date();
      const time = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;
      entry.innerHTML = `<span class="log-time">${time}</span><span class="log-msg ${type}">${msg}</span>`;
      el.appendChild(entry);
      el.scrollTop = el.scrollHeight;
      logCount++;
      document.getElementById('logCount').textContent = logCount;
    };

    const setStatus = (s) => {
      document.getElementById('statusDot').className = `status-dot ${s}`;
      document.getElementById('statusText').textContent = s;
    };

    const send = (obj) => {
      log(`→ ${obj.type}`, "send");
      ws.send(JSON.stringify(obj));
    };

    // ── Connect ──────────────────────────────────────────
    document.getElementById("btnConnect").onclick = () => {
      log("Connecting to signaling");
      setStatus("connecting");
      ws = new WebSocket(WS_URL);

      ws.onopen = () => { log("Signaling connected", "event"); setStatus("connected"); };

      ws.onmessage = async (e) => {
        const msg = JSON.parse(e.data);
        log(`← ${msg.type}`, "info");
        await handleMessage(msg);
      };

      ws.onclose = () => {
        log("Signaling closed", "error");
        setStatus("disconnected");
        ['btnConnect', 'btnJoin', 'btnCamera', 'btnCall'].forEach((id, i) => {
          document.getElementById(id).disabled = i !== 0;
        });
        document.getElementById('btnDisconnect').disabled = true;
      };

      ws.onerror = () => log("WebSocket error", "error");
      document.getElementById("btnConnect").disabled = true;
      document.getElementById("btnDisconnect").disabled = false;
    };

    document.getElementById("btnJoin").onclick = () => {
      send({ type: "join", room_id: ROOM_ID, peer_id: peerId });
      document.getElementById('footerRoom').textContent = ROOM_ID;
    };

    document.getElementById("btnCamera").onclick = async () => {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById("localVideo").srcObject = localStream;
        document.getElementById('localPlaceholder').style.display = 'none';
        document.getElementById('localIndicator').classList.add('live');
        log("Camera enabled", "event");
      } catch (e) {
        log(`Camera error: ${e.message}`, "error");
      }
    };

    document.getElementById("btnCall").onclick = () => startCall();
    document.getElementById("btnDisconnect").onclick = () => {
      ws?.close();
      pc?.close();
      pc = null;
      roster = new Set();
      clearRemotes();
    };

    // ── Messages ─────────────────────────────────────────
    async function handleMessage(msg) {
      switch (msg.type) {
        case "connected":
          peerId = msg.peer_id;
          document.getElementById('footerPeerId').textContent = peerId.slice(0, 8) + '...';
          document.getElementById("btnCamera").disabled = false;
          document.getElementById("btnCall").disabled = false;
          break;
        case "joined_room":
          roster = new Set(msg.peers);
          log(`Joined room · ${msg.peers.length} peer(s) already here`, "event");
          reconcile();
          break;
        case "peer_joined":
          roster.add(msg.peer_id);
          log(`Peer joined · ${short(msg.peer_id)}`, "event");
          break;
        case "peer_left":
          roster.delete(msg.peer_id);
          log(`Peer left · ${short(msg.peer_id)}`, "event");
          // The SFU closes its m-lines on its side; the tile goes with them.
          removeRemote(msg.peer_id);
          break;
        case "sfu_answer":
          await pc.setRemoteDescription({ type: "answer", sdp: msg.sdp });
          log("Remote description set", "event");
          // Routing only starts once the transport exists: joining any earlier
          // would have the SFU re-offer to a connection that is not there yet.
          document.getElementById("btnJoin").disabled = false;
          break;
        case "sfu_offer":
          // The SFU re-offers whenever the room gains or loses a published
          // track: each one needs its own m-line here.
          await answerSfuOffer(msg.sdp);
          break;
        case "sfu_ice_candidate":
          if (pc && msg.candidate) {
            try { await pc.addIceCandidate({ candidate: msg.candidate, sdpMLineIndex: 0 }); } catch { }
          }
          break;
        case "error":
          log(`Error: ${msg.message}`, "error");
          break;
      }
    }

    const short = (id) => (id || "").slice(0, 8);

    // ── Start Call ───────────────────────────────────────
    async function startCall() {
      log("Creating RTCPeerConnection");

      if (pc) { pc.close(); pc = null; }
      clearRemotes();

      pc = new RTCPeerConnection({
        iceServers: [{ urls: "stun:stun.l.google.com:19302" }],
      });

      if (localStream) {
        // `sendonly`, not `sendrecv`: what this peer publishes and what it
        // receives are different m-lines. Sharing one would put every
        // publisher of the room into a single stream.
        localStream.getTracks().forEach(track => {
          pc.addTransceiver(track, { direction: 'sendonly', streams: [localStream] });
          log(`Publishing · ${track.kind}`);
        });
      } else {
        // Viewer with no camera: the offer still has to carry ICE and DTLS,
        // which live in the m-lines. These two stay unused — everything this
        // peer watches arrives on m-lines the SFU adds later.
        pc.addTransceiver('audio', { direction: 'recvonly' });
        pc.addTransceiver('video', { direction: 'recvonly' });
      }

      pc.onicecandidate = (e) => {
        if (e.candidate) send({ type: "sfu_ice_candidate", candidate: e.candidate.candidate });
      };

      pc.oniceconnectionstatechange = () => log(`ICE · ${pc.iceConnectionState}`, "event");
      pc.onconnectionstatechange = () => log(`Connection · ${pc.connectionState}`, "event");
      pc.ontrack = onRemoteTrack;

      try {
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        log("Offer created — sending to SFU");
        send({ type: "sfu_offer", sdp: offer.sdp });
      } catch (e) {
        log(`Offer error: ${e.message}`, "error");
      }
    }

    /// Answers a re-offer from the SFU.
    async function answerSfuOffer(sdp) {
      if (!pc) {
        log("SFU offer received before the call started — ignored", "error");
        return;
      }
      try {
        await pc.setRemoteDescription({ type: "offer", sdp });
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        send({ type: "sfu_answer", sdp: answer.sdp });
      } catch (e) {
        log(`Answer error: ${e.message}`, "error");
      }
    }

    // ── Remote tiles ─────────────────────────────────────
    //
    // One tile per publisher, not per track. The SFU names each m-line it adds
    // with the publisher's id as the msid stream id, so `streams[0].id` says
    // who a track belongs to — audio and video of one peer land in the same
    // MediaStream, and two peers never share a tile.

    const remotes = new Map(); // publisher peer_id → { card, stream }

    // Who the SFU says is in the room. A track is only ever shown for a peer on
    // this list: mid-renegotiation the browser can surface a stream whose msid
    // it has not resolved yet, under an id of its own making, and that would
    // otherwise leave a tile nothing ever fills.
    let roster = new Set();

    function onRemoteTrack(e) {
      const publisher = e.streams[0]?.id;
      if (!publisher) {
        // An m-line with no msid: one of the unused recvonly slots a
        // camera-less viewer offered. Nothing to show.
        return;
      }
      if (!roster.has(publisher)) {
        log(`Track from an unknown peer ignored · ${short(publisher)}`, "info");
        return;
      }

      const entry = remotes.get(publisher) ?? createRemote(publisher);
      entry.stream.addTrack(e.track);
      log(`Remote ${e.track.kind} · ${short(publisher)}`, "event");

      e.track.onended = () => removeTrack(publisher, e.track);
      e.track.onmute = () => entry.card.querySelector('.indicator').classList.remove('live');
      e.track.onunmute = () => entry.card.querySelector('.indicator').classList.add('live');
    }

    function createRemote(publisher) {
      const card = document.createElement('div');
      card.className = 'video-card';
      card.id = `remote-${publisher}`;

      const stream = new MediaStream();

      const video = document.createElement('video');
      video.autoplay = true;
      video.playsInline = true;
      video.srcObject = stream;

      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = short(publisher);

      const indicator = document.createElement('div');
      indicator.className = 'indicator live';

      card.append(video, label, indicator);
      document.getElementById('videoGrid').appendChild(card);

      const entry = { card, stream };
      remotes.set(publisher, entry);
      return entry;
    }

    function removeTrack(publisher, track) {
      const entry = remotes.get(publisher);
      if (!entry) return;
      entry.stream.removeTrack(track);
      if (entry.stream.getTracks().length === 0) removeRemote(publisher);
    }

    function removeRemote(publisher) {
      const entry = remotes.get(publisher);
      if (!entry) return;
      entry.card.remove();
      remotes.delete(publisher);
      log(`Tile removed · ${short(publisher)}`, "event");
    }

    function clearRemotes() {
      for (const publisher of [...remotes.keys()]) removeRemote(publisher);
    }

    /// Drops any tile whose peer is no longer in the room.
    function reconcile() {
      for (const publisher of [...remotes.keys()]) {
        if (!roster.has(publisher)) removeRemote(publisher);
      }
    }
  </script>
</body>

</html>
